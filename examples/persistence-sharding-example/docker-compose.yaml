version: '3.8'

services:
  pd:
    image: pingcap/pd:v6.5.0
    container_name: pd
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - ./config:/config:ro
      - ./data/pd:/data
    command:
      - --name=pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
      - --data-dir=/data/pd
    restart: unless-stopped

  tikv:
    image: pingcap/tikv:v6.5.0
    container_name: tikv
    ports:
      - "20160:20160"
    volumes:
      - ./config:/config:ro
      - ./data/tikv:/data
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --data-dir=/data/tikv
      - --pd=http://pd:2379
    depends_on:
      - pd
    restart: unless-stopped

  tidb:
    image: pingcap/tidb:v6.5.0
    container_name: tidb
    ports:
      - "4000:4000"
      - "10080:10080"
    volumes:
      - ./config:/config:ro
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    command:
      - --store=tikv
      - --path=pd:2379
      - -L=warn
    depends_on:
      - tikv
    restart: unless-stopped