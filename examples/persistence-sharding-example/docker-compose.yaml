version: "3.9"

services:
  pd:
    image: pingcap/pd:v7.5.0
    command:
      - --name=pd
      - --data-dir=/var/lib/pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
      - --log-file=
    ports:
      - "2379:2379"
    volumes:
      - pd-data:/var/lib/pd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:2379/pd/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  tikv:
    image: pingcap/tikv:v7.5.0
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --pd=pd:2379
      - --data-dir=/var/lib/tikv
      - --log-file=
    depends_on:
      pd:
        condition: service_healthy
    ports:
      - "20160:20160"
    volumes:
      - tikv-data:/var/lib/tikv
    restart: unless-stopped

  tidb:
    image: pingcap/tidb:v7.5.0
    command:
      - --store=tikv
      - --path=pd:2379
      - --advertise-address=tidb
      - --log-file=
    depends_on:
      - pd
      - tikv
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  pd-data:
  tikv-data:
