# ShardingSphere Configuration for Hibernate-based Persistence Layer
# 
# This configuration defines database and table sharding rules.
# ShardingSphere handles routing transparently, so Hibernate/HQL queries
# work normally without knowing about sharding.
#
# ⚠️ IMPORTANT: All data sources MUST use the same database type!
# ❌ DO NOT mix MySQL, PostgreSQL, Oracle, etc. in the same configuration.
# ✅ All shards must use the same database type (e.g., all MySQL or all PostgreSQL).

# Data source definitions
# Each data source represents a physical database
# All data sources must use the same database type and driver
dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/db_0?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=UTC
    username: root
    password: root
  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/db_1?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=UTC
    username: root
    password: root

# Sharding rules configuration
rules:
  - !SHARDING
    tables:
      # Example: User Coupon table sharding
      # Sharded by user_id across 2 databases and 32 tables (16 per database)
      t_user_coupon:
        # Actual data nodes: ds_0.t_user_coupon_0 through ds_1.t_user_coupon_31
        actualDataNodes: ds_${0..1}.t_user_coupon_${0..31}
        databaseStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user_coupon_database_mod
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user_coupon_table_mod
      
      # Example: Coupon Template table sharding
      # Sharded by shop_number across 2 databases and 16 tables (8 per database)
      t_coupon_template:
        actualDataNodes: ds_${0..1}.t_coupon_template_${0..15}
        databaseStrategy:
          standard:
            shardingColumn: shop_number
            shardingAlgorithmName: coupon_template_database_mod
        tableStrategy:
          standard:
            shardingColumn: shop_number
            shardingAlgorithmName: coupon_template_table_mod
      
      # Example: Coupon Settlement table sharding
      t_coupon_settlement:
        actualDataNodes: ds_${0..1}.t_coupon_settlement_${0..15}
        databaseStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: settlement_database_mod
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: settlement_table_mod

    # Sharding algorithm definitions
    shardingAlgorithms:
      # Database sharding algorithms
      user_coupon_database_mod:
        type: CLASS_BASED
        props:
          algorithmClassName: org.tus.common.sharding.algorithm.DBHashModShardingAlgorithm
          sharding-count: 32  # Total shards (database * table combinations)
          strategy: standard
      
      coupon_template_database_mod:
        type: CLASS_BASED
        props:
          algorithmClassName: org.tus.common.sharding.algorithm.DBHashModShardingAlgorithm
          sharding-count: 16
          strategy: standard
      
      settlement_database_mod:
        type: CLASS_BASED
        props:
          algorithmClassName: org.tus.common.sharding.algorithm.DBHashModShardingAlgorithm
          sharding-count: 16
          strategy: standard
      
      # Table sharding algorithms
      user_coupon_table_mod:
        type: CLASS_BASED
        props:
          algorithmClassName: org.tus.common.sharding.algorithm.TableHashModShardingAlgorithm
          strategy: standard
      
      coupon_template_table_mod:
        type: CLASS_BASED
        props:
          algorithmClassName: org.tus.common.sharding.algorithm.TableHashModShardingAlgorithm
          strategy: standard
      
      settlement_table_mod:
        type: CLASS_BASED
        props:
          algorithmClassName: org.tus.common.sharding.algorithm.TableHashModShardingAlgorithm
          strategy: standard

# ShardingSphere properties
props:
  # Print SQL statements (useful for debugging)
  sql-show: true
  # Enable SQL logging
  sql-simple: true
