# ShardingSphere Test Configuration 
# Simplified configuration for integration tests using Testcontainers 

dataSources:
  ds_0:
    dataSourceClassName: org.springframework.jdbc.datasource.DriverManagerDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    # For TiDB, point this to a TiDB-compatible endpoint; for local testing, use MySQL on a different port/db
    jdbcUrl: jdbc:mysql://localhost:4000/shard_0
    username: test
    password: test
  ds_1:
    dataSourceClassName: org.springframework.jdbc.datasource.DriverManagerDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:4000/shard_1
    username: test
    password: test
rules:
  - !SHARDING 
    tables:
      t_test_sharded:
        actualDataNodes: ds_${0..1}.t_test_sharded_${0..3}
        databaseStrategy: 
          standard:
            shardingColumn: user_id
            shardingAlgorithm: test_db_mod
        tableStrategy:
          standard: 
            shardingColumn: user_id
            shardingAlgorithm: test_table_mod
    shardingAlgorithm:
      test_db_mod: 
        type: CLASS_BASED
        props: 
          sharding-count: "8"
          algorithmClassName: org.tus.common.sharding.algorithm.DBHashModShardingAlgorithm 
      test_table_mod: 
        type: CLASS_BASED 
        props: 
          algorithmClassName: org.tus.common.sharding.algorithm.TableHashModShardingAlgorithm 

props:
  sql-show: true